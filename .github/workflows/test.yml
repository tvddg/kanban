name: Testing

on:
    pull_request:
        branches: [ main ]

jobs:
    tests:
        name: Run tests
        runs-on: ubuntu-latest
        
        steps:
          - name: Checkout code
            uses: actions/checkout@v7

          - name: Setup Node.js
            uses: actions/setup-node@v7
            with:
                node-version: 'latest'
                cache: 'npm'

          - name: Install dependencies
            run: npm ci
          
          - name: Run tests
            run: npm run test