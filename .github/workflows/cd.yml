name: CD

on:
    push:
        branches: [ main ]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                node-version-file: '.nvmrc'
                cache: 'npm'

            - run: npm ci

            - name: Build
              run: npm run build

            - name: Debug File System
              run: |
                echo "PWD:"
                pwd
                
                echo "Root folder content:"
                ls -la
                
                echo "Search next folder:"
                if [ -d ".next" ]; then
                echo "Folder found"
                ls -la .next/
                else
                echo "!Folder does not exist!"
                fi
            
            - name: Upload build
              uses: actions/upload-artifact@v7
              with:
                name: build-output
                path: .next/
                retention-days: 7
                if-no-files-found: error

    deploy:
        name: Deploy (dry run)
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Download build
              uses: actions/download-artifact@v7
              with:
                name: build-output
                path: .next/
            
            - name: Check artifact
              run: |
                echo "Build content:"
                ls -la .next/
                echo "Size: $(du -sh .next/ | cut -f1)"

            - name: Deploy
              run: echo "TODO real deploy" 

            - name: Report
              run: |
                echo "## Deployed successfully" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
                echo "- Author: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
                echo "- Size of the build: $(du -sh .next/ | cut -f1)" >> $GITHUB_STEP_SUMMARY